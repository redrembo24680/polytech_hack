[project]
name = "polytech-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "google-genai",
    "httpx",
    "python-dotenv",
    "anthropic>=2.3.0",
    "langchain-core>=1.7.3",
    "langchain-ollama>=1.1.0",
    "langchain-google-genai>=4.4.2",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
